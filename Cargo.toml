[package]
name = "ps-qa"
description = "Drive a running Blitz app through its MCP control socket and assert what the renderer did"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/ps-qa"
homepage = "https://github.com/pathscale/ps-qa"
keywords = ["qa", "testing", "blitz", "mcp", "ui"]
categories = ["development-tools::testing"]
publish = true

# Nothing here may pull in tauri, winit, wgpu or blitz. The protocol types come
# from `blitz-control-protocol` precisely so this binary can speak the wire
# without building the renderer that serves it; depending on
# `tauri-runtime-blitz` for the same types would build a browser engine to send
# a wheel event. `cargo tree -p ps-qa` is the check.
[dependencies]
blitz-control-protocol = "^0.1.0"
# The same framing the server uses, from the same crate, for the same reason as
# the protocol types: a hand-rolled length-prefix reader is how the Python
# client hung on its first malformed frame.
endpoint-libs = { version = "2.1.5", default-features = false, features = [
    "agent-control",
] }
eyre = "0.6"
# Decoding captured frames: the protocol carries RGBA8 as base64 because the
# transport is line-delimited JSON.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# `preserve_order` so the JSON dumps keep the server's field order rather than
# sorting it. The dump modes exist to be diffed against previous runs, and
# alphabetising the keys would make every historical comparison useless.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }

[[bin]]
name = "ps-qa"
path = "src/main.rs"


# The protocol crate, from the working checkout rather than the published pin.
#
# `CaptureRequest` and `CapturedImage` exist in `tauri-runtime-blitz` and not
# yet in the crates.io release, so a build against the pin fails to resolve
# them. AgencyZero carries the same patch for the same reason. Once the
# protocol crate publishes a version with capture, this block goes away.
[patch.crates-io]
blitz-control-protocol = { path = "/Users/revenge/code/tauri-runtime-blitz/crates/blitz-control-protocol" }
